# keyd 2.6.0; only this MacBook's internal keyboard, never the touchpad.
[ids]
k:05ac:0262:f2d1f5c2
-05ac:0262:799a7e74

[main]
leftmeta = layer(command)
rightmeta = layer(command)

[command:C]
tab = A-tab
space = M-space
grave = A-grave
h = M-h
m = M-h
q = C-q
left = home
right = end
up = C-home
down = C-end
backspace = C-u

[alt]
left = C-left
right = C-right
backspace = C-backspace

[command+shift]
tab = A-S-tab
z = C-S-z
3 = print
4 = M-S-4
5 = M-S-s
left = S-home
right = S-end
up = C-S-home
down = C-S-end

[control+command]
f = f11

[control+command+shift]
3 = M-C-S-3
4 = M-C-S-4
