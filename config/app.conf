# Cmd+Q is handled by the common application Quit dispatcher.
[*]
command.q = C-A-M-q
command.backspace = macro(S-home backspace)
command.h = C-A-M-h
alt+command.h = C-A-M-j
alt+command.m = C-A-M-m
alt+command.w = C-A-M-w
alt+command.d = C-A-M-d
control+command.space = C-A-M-space

[*gnome-terminal*]
command.backspace = C-u
command.c = C-S-c
command.v = C-S-v
command.t = C-S-t
command.n = C-S-n
command.w = C-S-w
command.f = C-S-f

[org-gnome-console]
command.backspace = C-u
command.c = C-S-c
command.v = C-S-v
command.t = C-S-t
command.n = C-S-n
command.w = C-S-w

[kitty]
command.backspace = C-u
command.c = C-S-c
command.v = C-S-v
command.t = C-S-t

[org-gnome-nautilus]
command.up = A-up
command.down = enter
# File actions are handled inside Finder, with text-entry guards.
command.backspace = C-A-S-backspace
command.i = C-A-S-i
command.d = C-A-S-d
command.y = C-A-S-y
command.[ = A-left
command.] = A-right
command+shift.g = C-l
command+shift.backspace = C-A-S-e
alt+command.v = C-A-S-v
command.comma = C-comma

# The desktop is a different application from Nautilus.
[com-rastersoft-ding]
command.backspace = C-A-S-backspace
command.i = A-enter
command.y = space

# GNOME reports DING desktop windows by their GJS WM_CLASS, not their app ID.
# Restrict this alias to desktop titles; never remap other GJS applications.
[gjs|desktop-icons-*]
command.backspace = C-A-S-backspace
command.i = A-enter
command.y = space
