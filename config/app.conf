# Cmd+Q is handled by the common application Quit dispatcher.
[*]
command.q = C-A-M-q

[*gnome-terminal*]
command.c = C-S-c
command.v = C-S-v
command.t = C-S-t
command.n = C-S-n
command.w = C-S-w
command.f = C-S-f

[org-gnome-console]
command.c = C-S-c
command.v = C-S-v
command.t = C-S-t
command.n = C-S-n
command.w = C-S-w

[kitty]
command.c = C-S-c
command.v = C-S-v
command.t = C-S-t

[org-gnome-nautilus]
command.up = A-up
command.down = enter
command.backspace = delete
