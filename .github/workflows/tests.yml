name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs dbus-daemon build-essential python3 python3-gi gir1.2-gtk-3.0 gir1.2-dbusmenu-glib-0.4 xvfb xauth libinput10 libglib2.0-bin gnome-shell-common nautilus libgtk-4-1 libadwaita-1-0
      # GTK resolves virtual accelerator modifiers through the display keymap.
      - run: xvfb-run -a env GDK_BACKEND=x11 bash tests/run.sh

